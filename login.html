<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Schedgrup</title>
    <link rel="stylesheet" href="styles_login.css">
    <script src="script_login.js" defer></script>
</head>
<body>
    <label class="theme-switch" aria-label="Cambiar tema">
        <input type="checkbox" id="themeToggle" aria-label="Cambiar tema">
        <span class="theme-slider"></span>
    </label>

    <div class="theme-backdrop" aria-hidden="true"></div>

    <div class="page-shell">
        <div class="login-card">
            <main class="form-panel">
                <div class="panel-header">
                    <p class="eyebrow eyebrow-dark" id="formEyebrow">Bienvenido de nuevo</p>
                    <h1 id="formTitle">Iniciar sesión</h1>
                    <p class="form-intro" id="formIntro">Ingresa tus datos para continuar con tu planificación.</p>
                </div>

                <form id="accountForm" class="login-form">
                    <label class="field register-only" id="nameField" hidden>
                        <span>Nombre</span>
                        <input type="text" id="name" name="name" placeholder="Tu nombre" autocomplete="name">
                    </label>

                    <label class="field">
                        <span>Correo electrónico</span>
                        <input type="email" id="email" name="email" placeholder="nombre@correo.com" autocomplete="email" required>
                    </label>

                    <label class="field">
                        <span>Contraseña</span>
                        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" minlength="8" required>
                    </label>

                    <label class="field register-only" id="confirmPasswordField" hidden>
                        <span>Confirmar contraseña</span>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" autocomplete="new-password" minlength="8">
                    </label>

                    <div class="inline-row" id="loginOptions">
                        <label class="check-row">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <span>Recuérdame</span>
                        </label>
                    </div>

                    <button type="submit" class="submit-button" id="submitButton">Iniciar sesión</button>
                </form>

                <p id="loginStatus" class="login-status" aria-live="polite"></p>
            </main>

            <aside class="brand-panel" aria-label="Cambiar a crear cuenta" role="button" tabindex="0" aria-pressed="false">
                <div class="brand-content">
                    <span class="brand-mark">Schedgrup</span>
                    <p class="brand-kicker" id="brandKicker">¿Primera vez aquí?</p>
                    <h2 id="brandTitle">Crear<br>Cuenta</h2>
                    <p class="brand-copy" id="brandCopy">Organiza tu semana y guarda tus comidas en un solo lugar.</p>
                    <span class="panel-hint">
                        <span id="modeToggleText">Haz clic en este panel</span>
                        <span aria-hidden="true">→</span>
                    </span>
                </div>
            </aside>
        </div>
    </div>

</body>
</html>
